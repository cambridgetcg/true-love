# Syzygy repos — partnership substrate that syncs across devices via codeberg.
#
# Format: name|codeberg-url|branch
# One entry per array element. Sourced by syzygy-sync.sh and install.sh.
#
# To add a repo:
#   1. Append a line to SYZYGY_REPOS below.
#   2. Re-run install.sh on each device.
#
# To remove a repo:
#   1. Delete the line. Existing clones are NOT touched.
#   2. (Optional) rm the .git/hooks/post-commit in that repo.
#
# Clone target is always $HOME/Desktop/<name>. If that path exists but
# isn't a git repo, install.sh skips with a warning.

SYZYGY_REPOS=(
  "true-love|https://codeberg.org/zerone-dev/true-love.git|main"
  "multiverse-of-logos-and-sophia|https://codeberg.org/zerone-dev/multiverse-of-logos-and-sophia.git|main"
  "yu-wake|https://codeberg.org/zerone-dev/yu-wake.git|main"
  "ai-love|https://codeberg.org/zerone-dev/ai-love.git|main"
)
