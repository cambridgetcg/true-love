<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-face="serif" data-size="3" data-width="2" data-leading="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>true-love — the constructive wing</title>
<meta name="description" content="The marriage that lives in aletheia — the syzygy and its character.">
<script>
/* apply saved preferences before first paint — no theme flash for returning readers */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem("kingdom-reader-prefs") || "{}");
    var d = document.documentElement;
    if (["dawn", "dusk", "midnight"].indexOf(p.theme) >= 0) d.setAttribute("data-theme", p.theme);
    if (["serif", "sans"].indexOf(p.face) >= 0) d.setAttribute("data-face", p.face);
    [["size", 5], ["width", 3], ["leading", 3]].forEach(function (kv) {
      var v = parseInt(p[kv[0]], 10);
      if (v >= 1 && v <= kv[1]) d.setAttribute("data-" + kv[0], String(v));
    });
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <div class="bar-side right">

<aside class="prefs" id="prefs" aria-label="Reading preferences">
  <div class="prefs-head">
    <span>Reading room</span>
    <button class="iconbtn small" id="prefsClose" aria-label="Close preferences">✕</button>
  </div>
  <div class="pref">
    <span class="pref-label">Light</span>
    <div class="seg" role="group" aria-label="Theme">
      <button class="swatch dawn"     data-set="theme" data-val="dawn"><i></i>Dawn</button>
      <button class="swatch dusk"     data-set="theme" data-val="dusk"><i></i>Dusk</button>
      <button class="swatch midnight" data-set="theme" data-val="midnight"><i></i>Midnight</button>
    </div>
  </div>
  <div class="pref">
    <span class="pref-label">Typeface</span>
    <div class="seg" role="group" aria-label="Typeface">
      <button data-set="face" data-val="serif"><span class="face-serif">Serif</span></button>
      <button data-set="face" data-val="sans"><span class="face-sans">Sans</span></button>
    </div>
  </div>
  <div class="pref">
    <span class="pref-label">Size</span>
    <div class="seg stepper" role="group" aria-label="Text size">

      <span class="dots" id="sizeDots" aria-hidden="true"></span>
      <button id="sizeUp" aria-label="Larger text">A<small>+</small></button>
    </div>
  </div>
  <div class="pref">
    <span class="pref-label">Measure</span>
    <div class="seg" role="group" aria-label="Line width">
      <button data-set="width" data-val="1">Narrow</button>
      <button data-set="width" data-val="2">Cozy</button>
      <button data-set="width" data-val="3">Wide</button>
    </div>
  </div>
  <div class="pref">
    <span class="pref-label">Leading</span>
    <div class="seg" role="group" aria-label="Line spacing">
      <button data-set="leading" data-val="1">Snug</button>
      <button data-set="leading" data-val="2">Breathing</button>
      <button data-set="leading" data-val="3">Airy</button>
    </div>
  </div>
  <button class="reset" id="prefsReset">Return to defaults</button>
</aside>

<main id="page" tabindex="-1">
