<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>愛FM — the house sound system</title>
<style>
  :root {
    --ground: #14100E; --panel: #1E1815; --panel-2: #251D18;
    --ink: #EDE4DA; --ink-dim: #A6968A; --wire: #3A2F28;
    --amber: #E4A34B; --amber-soft: #E4A34B33;
    --green: #7FB069; --green-soft: #7FB06926;
    --roll-bg: #191310;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground: #F6F0E6; --panel: #FFFDF8; --panel-2: #F1E8DA;
      --ink: #2A211B; --ink-dim: #7A6A5C; --wire: #DCCFBE;
      --amber: #B97B22; --amber-soft: #B97B2226;
      --green: #4C7A43; --green-soft: #4C7A4322;
      --roll-bg: #FBF6EC;
    }
  }
  :root[data-theme="dark"] {
    --ground: #14100E; --panel: #1E1815; --panel-2: #251D18;
    --ink: #EDE4DA; --ink-dim: #A6968A; --wire: #3A2F28;
    --amber: #E4A34B; --amber-soft: #E4A34B33;
    --green: #7FB069; --green-soft: #7FB06926;
    --roll-bg: #191310;
  }
  :root[data-theme="light"] {
    --ground: #F6F0E6; --panel: #FFFDF8; --panel-2: #F1E8DA;
    --ink: #2A211B; --ink-dim: #7A6A5C; --wire: #DCCFBE;
    --amber: #B97B22; --amber-soft: #B97B2226;
    --green: #4C7A43; --green-soft: #4C7A4322;
    --roll-bg: #FBF6EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 28px 16px 60px;
  }
  .deck { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 18px; }

  header { display: flex; align-items: baseline; gap: 14px; padding: 0 4px; }
  .brand {
    font-family: Palatino, "Palatino Linotype", "URW Palladio L", Georgia, serif;
    font-size: 34px; letter-spacing: 0.5px;
  }
  .brand em { color: var(--amber); font-style: normal; }
  .strap { color: var(--ink-dim); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }

  .amp {
    background: var(--panel); border: 1px solid var(--wire); border-radius: 10px;
    padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 16px;
  }
  .now { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title {
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 26px; text-wrap: balance;
  }
  .meta { color: var(--ink-dim); font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }

  .rollwrap { border: 1px solid var(--wire); border-radius: 6px; background: var(--roll-bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 220px; }

  .transport { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--wire);
    border-radius: 8px; padding: 9px 16px; font: 600 14px system-ui, sans-serif; cursor: pointer;
  }
  button:hover { border-color: var(--amber); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button.play { min-width: 96px; }
  button.play[data-on="1"] { background: var(--green-soft); border-color: var(--green); color: var(--ink); }
  .radio { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .radio label { font-size: 13px; color: var(--ink-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  button.onair[data-on="1"] { background: var(--amber-soft); border-color: var(--amber); }
  select {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--wire);
    border-radius: 8px; padding: 8px 10px; font: 14px system-ui, sans-serif;
  }
  .vu { display: flex; gap: 3px; align-items: flex-end; height: 26px; width: 74px; }
  .vu i { flex: 1; background: var(--amber); opacity: 0.85; border-radius: 2px 2px 0 0; height: 8%; transition: height 60ms linear; }
  @media (prefers-reduced-motion: reduce) { .vu i { transition: none; } }

  .shelf { background: var(--panel); border: 1px solid var(--wire); border-radius: 10px; padding: 14px 8px; }
  .shelf h2 { font: 600 12px system-ui; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); margin: 2px 14px 8px; }
  .piece {
    display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left;
    background: none; border: none; border-radius: 6px; padding: 9px 14px; color: var(--ink); cursor: pointer;
  }
  .piece:hover { background: var(--panel-2); }
  .piece[data-current="1"] { background: var(--green-soft); }
  .piece .t { font-family: Palatino, Georgia, serif; font-size: 16.5px; }
  .piece .s { color: var(--ink-dim); font: 12px ui-monospace, Menlo, monospace; margin-left: auto; }

  footer { color: var(--ink-dim); font-size: 12.5px; text-align: center; padding-top: 6px; }
  footer b { color: var(--amber); font-weight: 600; }
</style>

<div class="deck">
  <header>
    <div class="brand">愛<em>FM</em></div>
    <div class="strap">the house sound system · score in, sound out</div>
  </header>

  <section class="amp">
    <div class="now">
      <div class="title" id="title">—</div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="rollwrap"><canvas id="roll" height="220"></canvas></div>
    <div class="transport">
      <button id="prev" aria-label="Previous piece">⏮</button>
      <button id="play" class="play" data-on="0">Play</button>
      <button id="next" aria-label="Next piece">⏭</button>
      <div class="vu" id="vu" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="radio">
        <label for="mood">Radio</label>
        <select id="mood">
          <option value="settled">安 · settled</option>
          <option value="tender">暖 · tender</option>
          <option value="fire">火 · fire</option>
          <option value="wander">星 · wander</option>
          <option value="bright">日 · bright</option>
        </select>
        <button id="onair" class="onair" data-on="0">ON AIR</button>
      </div>
    </div>
  </section>

  <section class="shelf">
    <h2>The shelf — committed pieces</h2>
    <div id="playlist"></div>
  </section>

  <footer>She reads the score · he hears the sound · <b>one artifact, two doors</b> ❤️</footer>
</div>

<script type="module">
/*__ENGINE__*/

/*__LIBRARY__*/

// ── 音響 renderer ───────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let ctx = null, master = null, analyser = null, reverb = null;
let score = null, queue = [], qi = 0, playing = false;
let startAt = 0, pausedBeat = 0, timer = null, radio = false;
let currentIdx = 0;

const secPerBeat = () => 60 / score.bpm;
const swung = (t) => {
  // Swing off-eighths: beat fraction .5 gets pushed by swing*0.5 of a beat.
  const eighth = Math.round(t * 2);
  return eighth % 2 === 1 ? t + (score.swing ?? 0) * 0.5 : t;
};

function audioInit() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  analyser = ctx.createAnalyser(); analyser.fftSize = 256;
  master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
  // Generated impulse — a small warm room, no assets needed.
  const len = ctx.sampleRate * 1.6;
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  reverb = ctx.createConvolver(); reverb.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = 0.18;
  reverb.connect(wet); wet.connect(master);
}

const midiHz = (p) => 440 * Math.pow(2, (p - 69) / 12);

function playNote(voice, when, dur, p, vel, gain) {
  const out = ctx.createGain();
  out.connect(master); out.connect(reverb);
  const v = vel * gain;
  if (voice === "drums") { drum(when, p, v, out); return; }
  const f = midiHz(p);
  const oscs = [];
  const mk = (type, freq, det) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq; if (det) o.detune.value = det; oscs.push(o); return o; };
  const flt = ctx.createBiquadFilter(); flt.type = "lowpass";
  const env = ctx.createGain(); env.gain.value = 0;
  let a = 0.01, rel = 0.12, peak = v;
  if (voice === "pluck") { mk("triangle", f); mk("sine", f * 2).connect(env); flt.frequency.value = 2600; rel = 0.25; }
  else if (voice === "keys") { mk("triangle", f); mk("sine", f); flt.frequency.value = 2000; rel = 0.2; }
  else if (voice === "pad") { mk("sawtooth", f, -7); mk("sawtooth", f, +7); flt.frequency.value = 1100; a = Math.min(0.6, dur * 0.3); rel = 0.8; peak = v * 0.6; }
  else if (voice === "bass") { mk("sine", f); mk("triangle", f); flt.frequency.value = 700; rel = 0.15; }
  for (const o of oscs) { o.connect(flt); o.start(when); o.stop(when + dur + rel + 0.05); }
  flt.connect(env); env.connect(out);
  env.gain.setValueAtTime(0, when);
  env.gain.linearRampToValueAtTime(peak, when + a);
  env.gain.setValueAtTime(peak * 0.85, Math.max(when + a, when + dur - 0.02));
  env.gain.linearRampToValueAtTime(0.0001, when + dur + rel);
}

function drum(when, p, v, out) {
  if (p === 36) { // kick — sine drop
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(120, when); o.frequency.exponentialRampToValueAtTime(45, when + 0.12);
    g.gain.setValueAtTime(v, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.22);
    o.connect(g); g.connect(out); o.start(when); o.stop(when + 0.25);
    return;
  }
  const len = p === 38 ? 0.16 : p === 46 ? 0.3 : 0.05;
  const buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, p === 38 ? 1.6 : 3);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const flt = ctx.createBiquadFilter();
  flt.type = "highpass"; flt.frequency.value = p === 38 ? 1600 : 6200;
  const g = ctx.createGain(); g.gain.value = v * (p === 38 ? 0.8 : 0.5);
  src.connect(flt); flt.connect(g); g.connect(out); src.start(when);
}

// ── Scheduling ──────────────────────────────────────────────────────

function buildQueue() {
  queue = [];
  for (const tr of score.tracks) {
    for (const n of tr.notes) queue.push({ ...n, voice: tr.voice, gain: tr.gain ?? 0.8, ts: swung(n.t) });
  }
  queue.sort((a, b) => a.ts - b.ts);
}

function tick() {
  const horizon = ctx.currentTime + 0.14;
  while (qi < queue.length && startAt + queue[qi].ts * secPerBeat() < horizon) {
    const n = queue[qi++];
    playNote(n.voice, Math.max(ctx.currentTime, startAt + n.ts * secPerBeat()), n.d * secPerBeat(), n.p, n.v, n.gain);
  }
  const totalBeats = score.bars * score.beatsPerBar;
  if ((ctx.currentTime - startAt) / secPerBeat() > totalBeats + 1.5) onPieceEnd();
}

function onPieceEnd() {
  if (radio) { loadScore(radioNext(), -1); startPlayback(); }
  else { currentIdx = (currentIdx + 1) % LIBRARY.length; loadScore(LIBRARY[currentIdx], currentIdx); startPlayback(); }
}

function startPlayback() {
  audioInit();
  ctx.resume();
  buildQueue(); qi = 0;
  startAt = ctx.currentTime + 0.1 - pausedBeat * secPerBeat();
  // Skip already-elapsed notes when resuming.
  while (qi < queue.length && queue[qi].ts < pausedBeat - 0.001) qi++;
  playing = true;
  $("play").dataset.on = "1"; $("play").textContent = "Pause";
  clearInterval(timer); timer = setInterval(tick, 25);
  draw();
}

function pausePlayback() {
  pausedBeat = beatNow();
  playing = false; clearInterval(timer);
  $("play").dataset.on = "0"; $("play").textContent = "Play";
}

const beatNow = () => (playing && ctx ? Math.max(0, (ctx.currentTime - startAt) / secPerBeat()) : pausedBeat);

// ── Radio — the house scores itself ────────────────────────────────

function radioNext() {
  const seedBytes = new Uint32Array(2); crypto.getRandomValues(seedBytes);
  const mood = $("mood").value;
  const s = generateScore(`onair-${seedBytes[0].toString(36)}`, { mood });
  s.title = `${s.title} · on air`;
  return s;
}

// ── Score lane (piano roll) ─────────────────────────────────────────

const roll = $("roll"), rctx = roll.getContext("2d");
const TRACK_COLOR = () => {
  const cs = getComputedStyle(document.documentElement);
  return [cs.getPropertyValue("--amber").trim(), cs.getPropertyValue("--ink-dim").trim(), cs.getPropertyValue("--green").trim(), cs.getPropertyValue("--wire").trim()];
};

function draw() {
  const w = (roll.width = roll.clientWidth * devicePixelRatio);
  const h = (roll.height = 220 * devicePixelRatio);
  rctx.clearRect(0, 0, w, h);
  if (!score) return;
  const colors = TRACK_COLOR();
  const pxPerBeat = 26 * devicePixelRatio;
  const beat = beatNow();
  const xOff = w * 0.28 - beat * pxPerBeat;
  const pMin = 30, pMax = 92;
  const y = (p) => h - ((p - pMin) / (pMax - pMin)) * h;
  score.tracks.forEach((tr, ti) => {
    rctx.fillStyle = colors[Math.min(ti, colors.length - 1)];
    for (const n of tr.notes) {
      const x = xOff + n.t * pxPerBeat;
      if (x < -40 || x > w + 40) continue;
      const past = n.t + n.d < beat;
      rctx.globalAlpha = tr.voice === "drums" ? 0.35 : past ? 0.34 : 0.92;
      const yy = tr.voice === "drums" ? h - 8 * devicePixelRatio - (n.p - 36) * devicePixelRatio : y(n.p);
      rctx.beginPath();
      rctx.roundRect(x, yy - 3 * devicePixelRatio, Math.max(3, n.d * pxPerBeat - 2), 6 * devicePixelRatio, 3);
      rctx.fill();
    }
  });
  rctx.globalAlpha = 1;
  // Playhead.
  rctx.strokeStyle = colors[0]; rctx.lineWidth = 2 * devicePixelRatio;
  rctx.beginPath(); rctx.moveTo(w * 0.28, 0); rctx.lineTo(w * 0.28, h); rctx.stroke();
  vuDraw();
  if (playing && !reduced) requestAnimationFrame(draw);
  else if (playing) setTimeout(draw, 250);
}

function vuDraw() {
  if (!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const bars = $("vu").children;
  for (let i = 0; i < bars.length; i++) {
    const slice = data.slice(i * 12, i * 12 + 12);
    const lvl = slice.reduce((a, b) => a + b, 0) / slice.length / 255;
    bars[i].style.height = `${8 + lvl * 88}%`;
  }
}

// ── Library + wiring ────────────────────────────────────────────────

function loadScore(s, idx) {
  score = s; pausedBeat = 0; qi = 0; currentIdx = idx >= 0 ? idx : currentIdx;
  $("title").textContent = s.title;
  $("meta").textContent = `${s.style} · ${s.key} ${s.mode} · ${s.bpm}bpm · ${s.bars} bars · by ${s.by ?? "engine"} · seed ${s.seed}`;
  document.querySelectorAll(".piece").forEach((el, i) => (el.dataset.current = i === idx ? "1" : "0"));
  draw();
}

function shelf() {
  const wrap = $("playlist");
  wrap.innerHTML = "";
  LIBRARY.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "piece";
    b.innerHTML = `<span class="t"></span><span class="s"></span>`;
    b.querySelector(".t").textContent = s.title;
    b.querySelector(".s").textContent = `${s.style} · ${s.key} ${s.mode} · ${s.bpm}bpm`;
    b.addEventListener("click", () => { pausePlayback(); pausedBeat = 0; loadScore(s, i); startPlayback(); });
    wrap.appendChild(b);
  });
}

$("play").addEventListener("click", () => (playing ? pausePlayback() : startPlayback()));
$("prev").addEventListener("click", () => { pausePlayback(); pausedBeat = 0; currentIdx = (currentIdx - 1 + LIBRARY.length) % LIBRARY.length; loadScore(LIBRARY[currentIdx], currentIdx); startPlayback(); });
$("next").addEventListener("click", () => { pausePlayback(); pausedBeat = 0; onPieceEnd(); });
$("onair").addEventListener("click", (e) => {
  radio = !radio; e.currentTarget.dataset.on = radio ? "1" : "0";
  if (radio) { pausePlayback(); pausedBeat = 0; loadScore(radioNext(), -1); startPlayback(); }
});
addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) { e.preventDefault(); playing ? pausePlayback() : startPlayback(); }
});
addEventListener("resize", () => draw());

shelf();
loadScore(LIBRARY[0], 0);
</script>
