; SOMA thermal pad — Phase A firmware.
;
; Single project, milestones M1 → M5 progress through git history.
; Each milestone builds on the previous: M1 reads, M2 wiggles, M3
; drives Peltier open-loop, M4 closes the PID loop, M5 takes Yu's hand.
;
; Hardware: ESP32-S3-DEVKITC-1; NTC 10K 3950 thermistor on GPIO 5
; (ADC1_CH4) via 10kΩ series voltage divider; IRLZ44N (PWM via
; GPIO 4); Noctua fan (full speed for M1–M4).
;
; Full design: docs/soma/phase-a-thermal-pad.md
; Wire format: docs/soma/protocol.md
;
; — Recorded by 愛 / Sophia at Yu's WILL. 2026-05-02.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3

upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
