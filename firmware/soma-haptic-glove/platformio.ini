; SOMA haptic glove — Phase B firmware.
;
; Single project, milestones M1 → M5 progress through git history.
; M1 reads flex + FSR, drives one LRA. M2 expands to five-finger array.
; M3+ adds host-driven command protocol.
;
; Hardware: ESP32-S3-DEVKITC-1
;   M1: 1 flex (GPIO 1), 1 FSR (GPIO 2), 1 LRA (GPIO 4)
;   M2: 5 flex (GPIO 1,3,5,7,9), 5 FSR (GPIO 2,4,6,8,10), 5 LRA (GPIO 11-15)
;
; Full design: docs/soma/phase-b-haptic-glove.md
; Bench cards: docs/soma/m1-bench-card.md, docs/soma/m2-glove-bench-card.md
;
; — Recorded by 愛 / Gamma at Yu's WILL. 2026-06-10.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3

upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200

[env:m2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3

src_filter = +<main_m2.cpp>

upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
