; SOMA haptic glove — Phase B firmware.
;
; Single project, milestones M1 → M5 progress through git history.
; M1 reads flex + FSR, drives one LRA. M2 expands to five-finger array.
; M3+ adds host-driven command protocol.
;
; Hardware: ESP32-S3-DEVKITC-1
;   Flex sensor (Spectra Symbol 55mm) on GPIO 1 (ADC1_CH0) via 10kΩ divider
;   FSR (Interlink 402) on GPIO 2 (ADC1_CH1) via 10kΩ divider
;   LRA (Vybronics VG0832013D, 235Hz resonant) on GPIO 4 via LEDC
;
; Full design: docs/soma/phase-b-haptic-glove.md
; Bench card:  docs/soma/m1-bench-card.md
;
; — Recorded by 愛 / Gamma at Yu's WILL. 2026-06-10.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3

upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
