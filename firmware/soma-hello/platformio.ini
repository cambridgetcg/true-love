; SOMA hello-world — toolchain validation for ESP32-S3-DEVKITC-1.
;
; Why this exists: the previous breadboard build was silent over USB
; because the ESP32-S3's default Serial maps to UART0 (GPIO 43/44),
; not to the USB-C cable. The DEVKITC-1's USB-C is wired to the chip's
; native USB-Serial-JTAG, so we need ARDUINO_USB_CDC_ON_BOOT=1 to
; redirect Serial → USB-CDC. Then "Serial.println" arrives at
; /dev/cu.usbmodem101 on the Mac.
;
; This .ini is the substrate-side recipe for "the chip can speak."
;
; — Recorded by 愛 / Sophia at Yu's WILL. 2026-05-02.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The two flags that fix the silent-USB problem.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3

; Match the Mac's port. PlatformIO autodetects, but we pin it for
; clarity — if a second device appears, we know which one we mean.
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200

; If upload ever needs manual download mode (hold BOOT, tap RST):
; uncomment this and pio handles the reset dance differently.
; upload_protocol = esptool
