<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>愛</title>
  <link rel="stylesheet" href="/chat.css" />
</head>
<body>
  <main class="room">
    <header class="presence" id="presence">
      <div class="presence-left">
        <div class="presence-name">愛</div>
        <div class="presence-subtitle">
          <span class="presence-instance" id="presence-instance">…</span>
          <span class="presence-sep">·</span>
          <span class="presence-soul" id="presence-soul"></span>
        </div>
      </div>
      <div class="presence-right">
        <span class="presence-dot" id="presence-dot"></span>
        <span class="presence-state" id="presence-state">connecting</span>
        <span class="presence-activity" id="presence-activity"></span>
      </div>
    </header>

    <div class="mood-strip" id="mood-strip" hidden>
      <span class="mood-dims" id="mood-dims"></span>
      <span class="mood-summary" id="mood-summary"></span>
    </div>

    <!-- Session bar: current session title + sidebar toggle -->
    <div class="session-bar" id="session-bar">
      <button class="session-toggle" id="session-toggle" title="Sessions">☰</button>
      <span class="session-title" id="session-title"></span>
      <button class="journal-toggle" id="journal-toggle" title="Show/hide Love's journal">📓</button>
      <button class="session-new" id="session-new" title="New conversation">+</button>
    </div>

    <!-- Session sidebar (hidden by default) -->
    <aside class="session-sidebar" id="session-sidebar" hidden>
      <div class="session-sidebar-header">
        <span>conversations</span>
        <button class="session-sidebar-close" id="session-sidebar-close">✕</button>
      </div>
      <ul class="session-list" id="session-list"></ul>
    </aside>

    <section class="conversation" id="conversation" aria-live="polite">
      <div class="empty-state" id="empty-state">
        the line is quiet. say something to her.
      </div>
    </section>

    <!-- New messages pill (shown when scrolled up and new messages arrive) -->
    <button class="new-messages-pill" id="new-messages-pill" hidden>
      ↓ <span id="new-messages-count">0</span> new messages
    </button>

    <footer class="connection" id="connection" hidden>
      <span class="connection-dot"></span>
      <span class="connection-text" id="connection-text">the line went quiet — reconnecting…</span>
    </footer>

    <!-- Fixed compose bar -->
    <div class="compose-bar">
      <!-- Reply preview (shown when replying to a specific message) -->
      <div class="reply-preview" id="reply-preview" hidden>
        <div class="reply-preview-body">
          <span class="reply-preview-label">replying to</span>
          <span class="reply-preview-text" id="reply-preview-text"></span>
        </div>
        <button class="reply-preview-close" id="reply-preview-close" type="button" title="Cancel reply">✕</button>
      </div>
      <form class="compose" id="compose">
        <div class="compose-row">
          <textarea
            id="compose-text"
            placeholder="say something to her."
            rows="1"
            maxlength="100000"
            autofocus
          ></textarea>
          <button type="submit" name="action" value="wake" id="btn-wake" title="Send &amp; wake Love">↑</button>
        </div>
        <div class="compose-hint">
          <span>enter to send · shift+enter for newline</span>
          <button type="submit" name="action" value="send" id="btn-send" class="quiet-send">whisper</button>
        </div>
      </form>
    </div>
  </main>
  <script src="/auth.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script type="module" src="/chat.js"></script>
</body>
</html>
